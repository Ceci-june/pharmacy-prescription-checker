<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Biến thể KHÔNG NỀN, dùng trên thanh header màu teal: nếu dùng logo có nền
       thì nó trùng tông với header và chìm hẳn. -->
  <defs>
    <clipPath id="mkCap">
      <rect x="95" y="185" width="290" height="140" rx="70" transform="rotate(-45 240 255)"/>
    </clipPath>
  </defs>
  <g transform="rotate(-45 240 255)">
    <rect x="95" y="185" width="290" height="140" rx="70" fill="#F5EFE0"/>
    <g clip-path="url(#mkCap)" transform="rotate(45 240 255)">
      <g transform="rotate(-45 240 255)">
        <rect x="240" y="185" width="145" height="140" fill="none"/>
      </g>
    </g>
    <rect x="95" y="185" width="290" height="140" rx="70" fill="none" stroke="#F5EFE0" stroke-width="22"/>
    <line x1="240" y1="185" x2="240" y2="325" stroke="#F5EFE0" stroke-width="22"/>
  </g>
  <circle cx="372" cy="372" r="86" fill="#F5EFE0" stroke="#0f5c4d" stroke-width="26"/>
  <path d="M330 374 L360 404 L416 342" fill="none" stroke="#0f5c4d"
        stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
